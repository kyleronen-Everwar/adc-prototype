<style>
*{box-sizing:border-box}body{margin:0;background:#15121c;color:#ddd;font:14px/1.35 system-ui,sans-serif}
#app{max-width:480px;margin:auto;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#221c2c;position:sticky;top:0;z-index:2}
header b{color:#ffd75e}.pill{background:#332a40;border-radius:10px;padding:2px 8px;margin-left:4px;font-size:12px}
nav{display:flex;background:#1c1724}nav button{flex:1;padding:9px 0;background:none;border:0;color:#aaa;font-weight:600;border-bottom:2px solid transparent}
nav button.on{color:#fff;border-color:#ffd75e}
.sec{padding:10px}.card{background:#211b2a;border-radius:8px;padding:10px;margin-bottom:10px}
h3{margin:0 0 6px;font-size:14px;color:#ffd75e}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:4px 0}
button.b{background:#3d3150;color:#fff;border:0;border-radius:6px;padding:7px 10px;font-weight:600}
button.b:disabled{opacity:.35}button.go{background:#c58a1a;width:100%;padding:12px;font-size:16px}
.sm{font-size:12px;color:#999}select,input{background:#2c2438;color:#ddd;border:1px solid #444;border-radius:5px;padding:4px}
canvas{width:100%;display:block;border-radius:8px;background:#000}
.bar{height:14px;background:#333;border-radius:7px;overflow:hidden;position:relative;margin:3px 0}
.bar>i{display:block;height:100%}.bar>span{position:absolute;inset:0;font-size:11px;text-align:center;line-height:14px;color:#fff}
#log{height:170px;overflow:auto;background:#0e0c12;border-radius:8px;padding:6px;font-size:12px}
.pot{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid #844;margin-right:4px}.pot.f{background:#d33}
.item{display:flex;justify-content:space-between;align-items:center;border-left:4px solid;padding:4px 6px;margin:3px 0;background:#1a1522;border-radius:4px}
.item .n{font-weight:600}.speed button{padding:5px 9px}.speed button.on{background:#c58a1a}
.heir{border:1px solid #444;border-radius:8px;padding:8px;margin:6px 0}.heir.on{border-color:#ffd75e}

const RAR=['common','uncommon','rare','epic','legendary','mythic'];

const BIOMES=[
 {n:'Crypts',c:'#3b3550',e:[['Skeleton',30,5,10,'blunt'],['Ghoul',40,6,5,'poison'],['Crypt Rat',15,2,0,'pack'],['Bone Archer',22,7,5,'ranged']]},

 {n:'Mines',c:'#3d3328',e:[['Kobold Sapper',25,14,5,'explode'],['Rock Crawler',60,8,40,'burrow'],['Deep Spider',35,8,10,'poison'],['Ore Golem',90,10,50,'slow']]},
 {n:'Cathedral',c:'#3a3f52',e:[['Cathedral Golem',100,12,40,'magres'],['Wraith',45,12,0,'physres'],['Zealot',50,9,15,'healer']]},
 {n:'The Pit',c:'#521f1f',e:[['Imp',30,10,5,'fire'],['Hellhound',55,13,15,'fire'],['Abyssal Horror',140,16,30,'drain']]}];
const BANDS=[{n:'Safe',p:85,m:1},{n:'Fair',p:65,m:1.5},{n:'Risky',p:37,m:2.5},{n:'Long shot',p:15,m:4}];

let RNG=Math.random; const rnd=()=>RNG(), ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)), pick=a=>a[Math.floor(rnd()*a.length)];

function newSave(){
  const s={v:1,gold:30,gen:1,base:{str:5,agi:5,int:5,vit:5},buy:{str:5,agi:8,int:2,vit:5},bag:[],equip:{},vault:[],
    potions:0,divine:'heal',healAt:30,magnetFloor:5,die:true,oneHand2H:false,wager:null,reroll:0,best:0,runs:[],heirs:null,lastRun:null,offspring:2};
  ITEMS.filter(i=>i.set.startsWith('Roadworn')).forEach(t=>{const it=mkItem(t,1);s.equip[t.slot=='Ring'?'Ring 1':t.slot]=it;});
  return s;
}
let UID=1;
function mkItem(t,floor,boost=0){
  const k=Math.pow(1.0175,floor-1)*(1+boost), st={};
  for(const a in t.s) st[a]=Math.max(1,Math.round(t.s[a]*k));
  const it={id:Date.now().toString(36)+(UID++),n:t.n,slot:t.slot,r:t.r,s:st,e:t.e,th:t.th,k:t.k,fl:floor};
  if(t.slot=='Main hand') it.dmg=Math.round(WDMG[t.r]*sc(floor)*(1+boost)*10)/10;
  else if(t.slot=='Off hand'&&t.k=='dagger') it.dmg=Math.round(WDMG[t.r]*.5*sc(floor)*(1+boost)*10)/10;
  if(['Helmet','Chest piece','Gloves','Leggings','Boots'].includes(t.slot)||t.k=='shield') it.arm=Math.round(ARM[t.r]*(t.k=='shield'?1.5:1)*sc(floor)*(1+boost));
  return it;
}
function rarityRoll(floor,mult=1){
  const st=Math.floor((floor-1)/10); let w=[52-3*st,25,12+st,7+st,4+st]; // base run: mythic 1% -> legendary (decision 72)
  let x=rnd()*100; for(let i=0;i<5;i++){ if((x-=w[i])<0) return RAR[i]; } return 'common';
}
function dropItem(floor){ const r=rarityRoll(floor); return mkItem(pick(ITEMS.filter(i=>i.r==r)),floor); }

function primaries(S){ const p={}; for(const a of ['str','agi','int','vit']) p[a]=S.base[a]+S.buy[a]; return p; }
function totals(S){
  const p=primaries(S); p.regen=0; let dmg=0,arm=0,oh=null,mh=S.equip['Main hand'];
  for(const sl of SLOTS){ const it=S.equip[sl]; if(!it) continue;

    for(const a in it.s) p[a]=(p[a]||0)+it.s[a]; if(it.arm) arm+=it.arm; }
  dmg=mh?mh.dmg:3; const off=S.equip['Off hand'];
  if(mh&&mh.th&&!S.oneHand2H) dmg*=1.2; // two-hander +20%
  else if(off&&off.dmg) dmg+=off.dmg;
  return {...p,wdmg:dmg,arm};
}
function classLabel(p){
  const t=Math.max(1,p.str+p.agi+p.int+p.vit);
  const x=(p.vit-p.int)/t, y=(p.agi-p.str)/t;
  let best=null,bd=9; for(const L of LABELS){const d=Math.hypot(L[1]-x,L[2]-y); if(d<bd){bd=d;best=L[0];}}
  return {label:best,x,y};
}

function startRun(S){
  const T=totals(S), maxHp=Math.round(40+T.vit*6), maxMp=Math.round(20+T.int*4);

  S.potions=0; S.reroll=0;
  R.th=T.vit>=60&&T.regen>=25?25:T.vit>=45&&T.regen>=15?15:T.vit>=30?10:5;

  return R;
}
function log(R,m,c){ R.log.push({m,c,f:R.f}); if(R.log.length>200) R.log.shift(); }
function planFloor(R){
  if(R.f%10==0) R.rooms=['boss'];
  else { R.rooms=['combat','trap','treasure','rest','event']; for(let i=4;i>0;i--){const j=ri(0,i);[R.rooms[i],R.rooms[j]]=[R.rooms[j],R.rooms[i]];} }

function spawn(R,boss){
  const b=biome(R.f), k=sc(R.f), list=[];
  if(boss){ const e=b.e.reduce((a,c)=>c[1]>a[1]?c:a); list.push(mkEn(e,k*1.0,3,'Boss: ')); }
  else { let n=ri(2,3); const e0=pick(b.e); if(e0[4]=='pack') n=3; for(let i=0;i<n;i++) list.push(mkEn(i?pick(b.e):e0,k,1,'')); }
  R.enemies=list;
}
function mkEn(e,k,hm,pre){ return {n:pre+e[0],hp:e[1]*k*hm*1.2,max:e[1]*k*hm*1.2,dmg:e[2]*k*1.5*(hm>1?1.6:1),arm:e[3]*k,tr:e[4],t:e[4]=='ranged'?0:0.9+rnd()*.6,blocked:false}; }
function heal(R,a){ R.hp=Math.min(R.maxHp,R.hp+a); }
function gainPotion(R){

  else { const m=R.maxHp-R.hp; heal(R,R.maxHp*.35); log(R,`Potion found with full slots: drank it (+${Math.round(Math.min(m,R.maxHp*.35))} HP).`,'#7f7'); }

 c.fillStyle='#000'; c.fillText('H',84,175); if(R.fx&&R.fx.t>0){ c.fillStyle=R.fx.crit?'#ffd75e':'#fff'; c.fillText((R.fx.crit?'CRIT ':'')+Math.round(R.fx.dmg),120,135); }
 if(R.fx2&&R.fx2.t>0){ c.fillStyle='#f73'; c.beginPath(); c.arc(200,165,10,0,7); c.fill(); }
 if(R.state=='fight') R.enemies.forEach((e,i)=>{ if(e.hp<=0) return; const x=250+i*72,y=125+(i%2)*25, boss=e.n.startsWith('Boss'); const s=boss?70:46;
   c.fillStyle=boss?'#a22':'#7a4a8a'; c.fillRect(x,y,s,s); c.fillStyle='#000'; c.fillRect(x,y-8,s,5); c.fillStyle='#e33'; c.fillRect(x,y-8,s*e.hp/e.max,5);
   c.fillStyle='#fff'; c.font='10px sans-serif'; c.fillText(e.n.slice(0,12),x,y+s+12); c.font='bold 14px sans-serif'; });
 else { c.fillStyle='rgba(255,255,255,.8)'; c.font='28px sans-serif'; c.fillText({trap:'⚠ trap',treasure:'✦ treasure',rest:'☀ rest',event:'? event'}[R.cur]||'',260,180); c.font='bold 14px sans-serif'; }
 if(R.dead||R.state=='done'){ c.fillStyle='rgba(0,0,0,.6)'; c.fillRect(0,0,W,H); c.fillStyle='#ffd75e'; c.font='bold 26px sans-serif'; c.fillText(R.dead?`Fell on floor ${R.f}`:'Floor 100 cleared!',100,140); c.font='bold 14px sans-serif'; }
 $('#fr').textContent=`F${R.f} R${Math.min(R.room+1,R.rooms.length)} · ${R.gold} g run gold`;
 $('#hpb').style.width=(100*R.hp/R.maxHp)+'%'; $('#hpt').textContent=`HP ${Math.ceil(R.hp)}/${R.maxHp}`;
 $('#mpb').style.width=(100*R.mp/R.maxMp)+'%'; $('#mpt').textContent=`Mana ${Math.floor(R.mp)}/${R.maxMp}`;
 $('#pots').innerHTML=[0,1,2].map(i=>`<span class="pot ${i<R.pot?'f':''}"></span>`).join('')+` <span class=sm>threshold ${R.th}%</span>`;
 $('#rg').innerHTML=`<span class=sm>loot ${R.loot.length} · kills ${R.kills}${R.wager?` · wager ${R.wager.n} F${R.wager.floor}${R.wager.done?(R.wager.ok?' ✔':' ✘'):''}`:''}</span>`;
 const L=$('#log'); const atB=L.scrollTop+L.clientHeight>=L.scrollHeight-20; L.innerHTML=R.log.map(l=>`<div style="color:${l.c||'#bbb'}">F${l.f} · ${esc(l.m)}</div>`).join(''); if(atB) L.scrollTop=L.scrollHeight;
 if((R.dead||R.state=='done')&&!$('#endb').innerHTML) $('#endb').innerHTML=`<button class="b go" style="margin-top:8px" onclick="tab='lineage';render()">Results & heirs ▶</button>`;
}
let last=performance.now();
function loop(now){ const dt=Math.min(.1,(now-last)/1000); last=now;
 if(R&&!R.dead&&R.state!='done'){ let g=dt*GS_PER_SEC*speed*(S.divine=='speed'&&!R.divineUsedSpeed?1.5:1); while(g>0){ const d=Math.min(.05,g); step(S,R,d); g-=d; if(R.dead||R.state=='done') break; }
   if(R.fx) R.fx.t-=dt*speed; if(R.fx2) R.fx2.t-=dt*speed;
   if(R.dead||R.state=='done'){ endRun(S,R); save(); hdr(); } }
 if(tab=='run') drawRun(); requestAnimationFrame(loop); }
function lineageHTML(){ let h=`<div class=sec>`;
 const L=S.lastRun; if(L) h+=`<div class=card><h3>Last run — Gen ${L.gen}</h3><div>Reached floor <b>${L.floor}</b> in ${L.time} game-sec · ${L.kills} kills · ${L.loot} items · run gold ${L.gold} + consolation ${L.cons}${L.vault?` · ${L.vault} vault item(s) returned`:''}</div>
 <div class=row style="margin-top:6px"><canvas id=gr width=220 height=220 style="width:180px;background:#0e0c12"></canvas><div style="flex:1;padding-left:8px">This character ended up a<br><b style="font-size:22px;color:#ffd75e">${L.label}</b><div class=sm>Nearest of 13 labels on the class graph (STR top, VIT right, AGI bottom, INT left). Ring = 0.75 heir reach (design aid, not enforced).</div></div></div></div>`;
 if(S.heirs){ const left=10-Object.values(steer).reduce((a,b)=>a+b,0);
  h+=`<div class=card><h3>Choose your heir (inherit ${Math.round(S.heirRate*100)}%, INT ×0.875, roll −2…+5)</h3>`+S.heirs.map((x,i)=>`<div class="heir ${heirSel==i?'on':''}" onclick="heirSel=${i};render()"><b>Heir ${i+1}</b> — STR ${x.str} · AGI ${x.agi} · INT ${x.int} · VIT ${x.vit} <span class=sm>(${classLabel(x).label})</span></div>`).join('');
  h+=`<div class=sm style="margin-top:6px">Lineage steer: ${left} of 10 left (max 4 per stat)</div>`+['str','agi','int','vit'].map(a=>`<div class=row><span>${SN[a]}</span><span><button class=b onclick="st('${a}',-1)" ${steer[a]?'':'disabled'}>−</button> +${steer[a]} <button class=b onclick="st('${a}',1)" ${left&&steer[a]<4?'':'disabled'}>+</button></span></div>`).join('')+
  `<button class="b go" onclick="takeHeir()">Continue the bloodline ▶</button></div>`; }
 h+=`<div class=card><h3>Run history</h3>`+(S.runs.map(r=>`<div class=sm>Gen ${r.gen} · F${r.floor} · ${r.label} · +${r.gold+r.cons}g</div>`).join('')||'<div class=sm>none yet</div>')+`</div></div>`; return h; }
function st(a,d){ steer[a]+=d; render(); }
function takeHeir(){ chooseHeir(S,heirSel,steer); steer={str:0,agi:0,int:0,vit:0}; heirSel=0; R=null; save(); tab='setup'; render(); }
function drawGraph(){ const cv=$('#gr'); if(!cv||!S.lastRun) return; const c=cv.getContext('2d'),C=110,Rr=90;
 c.strokeStyle='#666'; c.beginPath(); c.moveTo(C,C-Rr); c.lineTo(C+Rr,C); c.lineTo(C,C+Rr); c.lineTo(C-Rr,C); c.closePath(); c.stroke();
 c.font='9px sans-serif'; c.textAlign='center'; for(const L of LABELS){ c.fillStyle='#888'; c.fillText(L[0],C+L[1]*Rr*.92,C+L[2]*Rr*.92+3); }
 c.fillStyle='#ffd75e'; c.font='bold 10px sans-serif'; c.fillText('STR',C,10); c.fillText('AGI',C,218); c.textAlign='left'; c.fillText('VIT',198,C-8); c.fillText('INT',2,C-8);
 const x=C+S.lastRun.x*Rr, y=C+S.lastRun.y*Rr; c.strokeStyle='rgba(255,215,94,.4)'; c.beginPath(); c.arc(x,y,Rr*.75,0,7); c.stroke();
 c.fillStyle='#ff3'; c.beginPath(); c.arc(x,y,5,0,7); c.fill(); }
if(S.heirs) tab='lineage'; render(); requestAnimationFrame(loop);
window.onerror=(m)=>{document.title='ERR '+m;};
if(location.hash.startsWith('#autotest')){ speed=64; let n=0; setInterval(()=>{ try{
 if(S.heirs&&tab!='run'){ takeHeir(); n++; } else if(S.heirs&&tab=='run'){ tab='lineage'; render(); }
 else if(!R){ while(used()<20) S.buy[['str','agi','int','vit'][used()%4]]++; S.potions=3; go(); }
 document.title='OK runs='+n+' best='+S.best+' gen='+S.gen; }catch(e){document.title='ERR '+e.message;} },300); }
</script></body></html>
